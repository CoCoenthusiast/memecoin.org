name: Daily Unverified Users Cleanup

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 02:00 UTC
  workflow_dispatch:  # Allows manual trigger from the Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run cleanup API
        run: curl -s -X GET "\${CLEANUP_API_URL}" \
          -H "x-cleanup-secret: \${CLEANUP_SECRET}"
        env:
          CLEANUP_API_URL: https://YOUR_VERCEL_URL/api/admin/cleanup
          CLEANUP_SECRET: \${CLEANUP_SECRET}
