<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g stroke="#4ade80" stroke-width="0.3" opacity="0.15">
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
  </g>

  <!-- Diamond -->
  <polygon points="200,60 340,200 200,340 60,200"
    fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner diamond echo -->
  <polygon points="200,110 290,200 200,290 110,200"
    fill="none" stroke="#4ade80" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>

  <!-- Eye almond -->
  <path d="M120,200 Q200,145 280,200 Q200,255 120,200"
    fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pupil -->
  <circle cx="200" cy="200" r="10" fill="#4ade80" stroke="none"/>

  <!-- Pupil highlight -->
  <circle cx="196" cy="196" r="3" fill="#0a0f1a" stroke="none"/>

  <!-- Corner accents -->
  <g stroke="#4ade80" stroke-width="1" opacity="0.3" stroke-linecap="round">
    <line x1="20" y1="20" x2="50" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="50"/>
    <line x1="380" y1="20" x2="350" y2="20"/>
    <line x1="380" y1="20" x2="380" y2="50"/>
    <line x1="20" y1="380" x2="50" y2="380"/>
    <line x1="20" y1="380" x2="20" y2="350"/>
    <line x1="380" y1="380" x2="350" y2="380"/>
    <line x1="380" y1="380" x2="380" y2="350"/>
  </g>
</svg>
